version: 2

models:
  - name: job_postings
    description: Cleaned job postings filtered to exclude records with errors
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_id
        description: Unique identifier for each job posting
      - name: job_title
        description: Title of the job posting
      - name: company_name
        description: Name of the hiring company
      - name: job_location
        description: Geographic location of the job
      - name: job_via
        description: Platform or job board where the posting was found
      - name: job_schedule_type
        description: Employment type (e.g., Full-time, Contractor)
      - name: job_work_from_home
        description: Boolean indicating if the position is remote
      - name: search_date
        description: Date when the job posting was collected
      - name: search_term
        description: Search query used to collect the job posting

  - name: jobs_per_month
    description: Monthly count of job postings grouped by search role
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: month
        description: First day of the month truncated from search_date
      - name: role
        description: Search term representing the job role
      - name: postings
        description: Total number of job postings for the role in that month

  - name: top_locations
    description: Top 10 job locations ranked by total number of postings
    config:
      persist_docs:
        relation: true
        columns: true
    columns:
      - name: job_location
        description: Geographic location of the job postings
      - name: postings
        description: Total number of job postings in that location