name: dbt build & publish
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * 1'    # Mondays — the pipeline runs while you sleep
  workflow_dispatch:        # …and a manual Run button
permissions:
  contents: write           # lets the workflow update the release
jobs:
  build:
    runs-on: ubuntu-latest # runs on a ubuntu vm
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python scripts/download_data.py
      - run: uv run dbt build --profiles-dir ../ci
        working-directory: analytics
      - run: |
          gh release view warehouse >/dev/null 2>&1 || \
            gh release create warehouse \
              --title "Warehouse" \
              --notes "Warehouse — auto-built by dbt"
          gh release upload warehouse data/prod.duckdb --clobber
        env:
          GH_TOKEN: ${{ github.token }}